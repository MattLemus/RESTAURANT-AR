<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fritada</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  body{margin:0;font-family:system-ui,sans-serif}
  .cta{padding:14px 22px;font:inherit;font-size:18px;border:0;border-radius:28px;background:#111;color:#fff;text-decoration:none;text-align:center;white-space:nowrap}
  #ar{position:absolute;bottom:16px;left:50%;transform:translateX(-50%)}
  #slam{display:none;margin:12px auto}
</style>
</head>
<body>
<!-- Cada celular usa lo mejor que soporte: iPhone = Quick Look (ARKit) con fritada.usdz; Android con ARCore = WebXR;
     el resto = fritada-ar.html (giroscopio, como Snapchat sin ARCore; fritada-mesa.html = tarjeta como ancla). Scene Viewer queda fuera: se cierra solo en celulares sin ARCore.
     isSessionSupported('immersive-ar') da true en esos celulares, asi que la falla se detecta al intentar abrir el AR.
     fritada.usdz sale de fritada.glb con Blender (glb_to_usdz.py): 27 cm, Y arriba, metros. -->
<model-viewer src="fritada.glb" ios-src="fritada.usdz"
  ar ar-modes="webxr quick-look"
  ar-scale="fixed" ar-placement="floor"
  camera-controls tone-mapping="neutral" shadow-intensity="1"
  alt="Fritada"
  style="width:100%;height:80vh">
  <!-- model-viewer solo lo muestra si el celular puede abrir AR -->
  <button id="ar" class="cta" slot="ar-button">Ver en mi mesa (AR)</button>
</model-viewer>
<div style="text-align:center"><a id="slam" class="cta" href="fritada-ar.html">Ver en mi mesa (AR)</a></div>
<script>
  const mv = document.querySelector('model-viewer')
  mv.addEventListener('ar-status', (e) => { if (e.detail.status === 'failed') location.href = 'fritada-ar.html' })
  // sin boton de AR nativo (Android sin WebXR, Firefox...): ofrecer la version con giroscopio
  mv.addEventListener('load', () => { if (!mv.canActivateAR) document.getElementById('slam').style.display = 'inline-block' })
</script>
</body>
</html>
