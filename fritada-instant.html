<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba AR</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  body{margin:0;font-family:system-ui,sans-serif;text-align:center}
  h2{margin:14px 0 0;font-size:18px}
  model-viewer{width:100%;height:42vh}
  .cta{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);padding:12px 20px;font:inherit;font-size:16px;border:0;border-radius:24px;background:#111;color:#fff;white-space:nowrap}
</style>
</head>
<body>
<!-- Prueba: abrir el AR del iPhone igual que Menuly (milanesa en ~1 s en un iPhone 14). model-viewer con quick-look y
     sin ios-src arma el USDZ al tocar el boton (con anclaje a superficie horizontal y texturas de 1024),
     en vez de nuestro fritada.usdz de Blender (11 MB, sin anclaje). 1 = modelo completo, 2 = liviano como el de Menuly -->
<h2>Prueba 1: fritada completa</h2>
<model-viewer src="fritada.glb" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed"
  camera-controls tone-mapping="neutral" shadow-intensity="1" alt="Fritada completa">
  <button class="cta" slot="ar-button">Ver en mi mesa (prueba 1)</button>
</model-viewer>
<h2>Prueba 2: fritada liviana</h2>
<model-viewer src="fritada-lite.glb" ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed"
  camera-controls tone-mapping="neutral" shadow-intensity="1" alt="Fritada liviana">
  <button class="cta" slot="ar-button">Ver en mi mesa (prueba 2)</button>
</model-viewer></body>
</html>
