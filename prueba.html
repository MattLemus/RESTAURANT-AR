<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba fritada</title>
<style>
  body{margin:0;font-family:system-ui,sans-serif;background:#fff;color:#111}
  #grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px}
  .cel{border:2px solid #111;border-radius:8px;overflow:hidden;text-align:center;font-size:18px;font-weight:bold}
  .cel model-viewer,.cel canvas{display:block;width:100%;height:24vh}
  #log{margin:6px;padding:6px;border:2px solid #111;border-radius:8px;font:12px/1.35 monospace;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<!-- Pagina de diagnostico (no es para clientes). En un Samsung con ARCore el plato baja completo pero no se dibuja,
     ni en 3D ni en AR. Cada cuadro separa una causa: 1 = WebGL dibuja algo, 2 = el visor dibuja un modelo de Google,
     3 = el plato sin mapas extra (solo color), 4 = el plato de fritada.html. Sintaxis vieja (var, function) a proposito. -->
<div id="grid">
  <div class="cel"><canvas id="gl" width="64" height="64"></canvas>1</div>
  <div class="cel"><model-viewer data-n="2" src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" camera-controls></model-viewer>2</div>
  <div class="cel"><model-viewer data-n="3" src="fritada-lite.glb" camera-controls tone-mapping="neutral"></model-viewer>3</div>
  <div class="cel"><model-viewer data-n="4" src="fritada.glb" camera-controls tone-mapping="neutral" shadow-intensity="1"></model-viewer>4</div>
</div>
<div id="log"></div>
<script>
  var t0 = Date.now(), lines = [], vistos = {}
  function log(s) { lines.push(((Date.now() - t0) / 1000).toFixed(1) + 's ' + s); document.getElementById('log').textContent = lines.join('\n') }
  window.addEventListener('error', function (e) { log('ERROR: ' + e.message + ' ' + (e.filename || '') + ':' + (e.lineno || '')) })
  window.addEventListener('unhandledrejection', function (e) { log('ERROR: ' + (e.reason && e.reason.message || e.reason)) })
  // three.js avisa por consola cuando un shader no compila o se pierde el contexto WebGL: se copia aqui, sin repetir
  ;['error', 'warn'].forEach(function (k) {
    var orig = console[k]
    console[k] = function () {
      var s = Array.prototype.join.call(arguments, ' ').slice(0, 300)
      if (!vistos[s]) { vistos[s] = 1; log('consola ' + k + ': ' + s) }
      return orig.apply(console, arguments)
    }
  })

  var m = navigator.userAgent.match(/Chrome\/([\d.]+)/), an = navigator.userAgent.match(/Android [^;)]*;[^;)]*/)
  log('Chrome ' + (m ? m[1] : 'NO es Chrome') + ' | ' + (an ? an[0] : navigator.platform))
  var gl2 = document.createElement('canvas').getContext('webgl2'), gl = gl2 || document.createElement('canvas').getContext('webgl')
  log('WebGL2: ' + (gl2 ? 'si' : 'NO') + ', WebGL1: ' + (gl ? 'si' : 'NO'))
  if (gl) {
    var dbg = gl.getExtension('WEBGL_debug_renderer_info')
    log('Grafica: ' + gl.getParameter(dbg ? dbg.UNMASKED_RENDERER_WEBGL : gl.RENDERER) + ' | textura max ' + gl.getParameter(gl.MAX_TEXTURE_SIZE)
      + ' | float: ' + (gl2 ? (gl2.getExtension('EXT_color_buffer_float') ? 'si' : 'NO') + ', half: ' + (gl2.getExtension('EXT_color_buffer_half_float') ? 'si' : 'NO') : '?'))
  }
  // cuadro 1: WebGL pinta verde
  var g = document.getElementById('gl').getContext('webgl2') || document.getElementById('gl').getContext('webgl')
  if (g) { g.clearColor(0, 0.7, 0.2, 1); g.clear(g.COLOR_BUFFER_BIT) } else log('Cuadro 1: sin WebGL')
</script>
<script nomodule>log('ERROR: este Chrome no soporta modulos, el visor 3D no puede correr')</script>
<script type="module" src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js" onerror="log('ERROR: no se pudo bajar el visor 3D (unpkg.com)')"></script>
<script>
  if (window.customElements) customElements.whenDefined('model-viewer').then(function () { log('Visor 3D listo') })
  setTimeout(function () { if (!window.customElements || !customElements.get('model-viewer')) log('A los 15 s el visor 3D todavia no arranco') }, 15000)
  Array.prototype.forEach.call(document.querySelectorAll('model-viewer'), function (mv) {
    var n = mv.getAttribute('data-n')
    mv.addEventListener('load', function () { log('Cuadro ' + n + ': modelo cargado') })
    mv.addEventListener('error', function (e) { log('Cuadro ' + n + ' ERROR: ' + (e.detail && (e.detail.type + ' ' + (e.detail.sourceError || '')))) })
  })
</script>
</body>
</html>
