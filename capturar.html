<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1311">
<title>Escanear plato · Restaurant AR</title>
<link rel="stylesheet" href="captura/capturador.css?v=3">
<script defer src="captura/calidad.js?v=3"></script>
<script defer src="captura/capturador.js?v=3"></script>
</head>
<body>
<main>
  <header><h1>Escanear plato</h1><span id="offline">Preparando modo sin cable…</span></header>
  <div id="zones" aria-label="Alturas del escaneo"></div>
  <section id="view" aria-label="Cámara y guía de captura">
    <video id="video" autoplay muted playsinline></video>
    <svg viewBox="0 0 300 400" preserveAspectRatio="none" class="guide" aria-hidden="true">
      <ellipse id="oval" cx="150" cy="200" rx="118" ry="102" fill="none" stroke="#71f5ad" stroke-width="2.5" stroke-dasharray="8 5" vector-effect="non-scaling-stroke"/>
      <g id="dots"></g>
    </svg>
    <div class="view-top">
      <span id="zone"></span>
      <div id="angle" class="angle">
        <svg viewBox="0 0 36 32" aria-hidden="true"><path d="M3 27h30" stroke="currentColor" stroke-width="2"/><path id="angleNeedle" d="M5 26h24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        <div><strong id="angleTitle">Guía de altura</strong><small id="height"></small></div>
      </div>
    </div>
    <img id="last" hidden alt="Última foto tomada">
    <div id="orbit">
      <p id="msg" role="status" aria-live="polite">Preparando cámara…</p>
      <div id="orbitHint"></div>
      <progress id="stability" max="1" value="0" aria-label="Estabilidad antes del disparo"></progress>
      <button id="confirm" type="button" hidden>Ya cambié de posición</button>
    </div>
  </section>
  <p id="hint" class="muted"></p>
  <section id="captureControls" aria-label="Controles de captura">
    <label class="plan">Guía para una vuelta <select id="plan"><option value="15">15 posiciones</option><option value="24" selected>24 posiciones</option><option value="34">34 posiciones</option></select></label>
    <label class="framing"><input type="checkbox" id="framing"> El plato completo está dentro del óvalo</label>
    <div class="actions"><button id="start" class="primary" disabled>Empezar</button><button id="next" disabled>Pasar a diagonal</button></div>
    <div class="actions"><button id="finish" class="quiet" disabled>Listo, terminar captura</button><button id="repeat" class="quiet" disabled>Repetir última</button></div>
  </section>
  <section id="delivery" hidden>
    <h2>Escaneo listo</h2>
    <p id="coverage"></p>
    <p>Conecta el celular por USB, abre <strong>ABRIR_ESCANER.bat</strong> en la PC y toca el botón de abajo.</p>
    <div class="actions"><button id="process" class="primary">Enviar y generar 3D</button><button id="resumeCapture">Volver a capturar</button></div>
    <p id="jobStatus" role="status" aria-live="polite"></p>
    <a id="downloadModel" hidden>Descargar modelo 3D</a>
  </section>
  <p id="counter" class="muted"></p>
  <details><summary>Fotos y ajustes</summary>
    <p id="destination"></p><small id="session"></small>
    <p id="quality" class="muted"></p><p id="camera" class="muted"></p>
    <label>Movimiento <select id="mode"><option value="walk">Caminar alrededor del plato</option><option value="turntable">Girar la base</option></select></label>
    <label><input id="useTilt" type="checkbox" checked> Usar el sensor para guiar la inclinación</label>
    <label><input id="useCompass" type="checkbox" checked> Usar el sensor para guiar la vuelta</label>
    <div class="actions wrap"><button id="import" disabled>Importar foto original</button><button id="review">Revisar fotos</button><button id="manifest">Descargar informe</button><button id="resend">Copiar a la PC</button><button id="new">Nueva sesión</button></div>
    <input id="file" type="file" accept="image/jpeg,image/png" capture="environment" hidden>
    <img id="reviewImage" hidden alt="Original seleccionado para revisión"><div id="gallery"></div>
  </details>
</main>
</body>
</html>
