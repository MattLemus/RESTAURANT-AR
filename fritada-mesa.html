<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fritada en tu mesa</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  #ar{position:fixed;inset:0}
  #close{position:fixed;z-index:2;top:16px;right:16px;width:52px;height:52px;border-radius:50%;background:rgba(30,30,30,.82);display:grid;place-items:center}
  #close svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
  #msg{position:fixed;z-index:2;left:12px;right:80px;top:16px;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;font-size:15px;text-align:center;pointer-events:none;transition:opacity .6s}
</style>
<script type="importmap">
{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
}}
</script>
</head>
<body>
<div id="ar"></div>
<a id="close" href="fritada.html" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></a>
<div id="msg">Apunta la cámara a la tarjeta del QR que está en la mesa.</div>
<script type="module">
// AR para celulares sin ARCore: la tarjeta del QR (tarjeta.mind, ver make_card.py) es el ancla.
// MindAR la reconoce y el plato de tamaño real queda encima; si la pierde, el plato se oculta.
import * as THREE from 'three'
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js'
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js'
import {MindARThree} from 'mindar-image-three'

const q = new URLSearchParams(location.search)
const CARD_W = +q.get('w') || 0.105 // m: ancho real de la tarjeta impresa (A6); fija la escala del plato
const msg = document.getElementById('msg')

const mindar = new MindARThree({
  container: document.getElementById('ar'), imageTargetSrc: 'tarjeta.mind',
  uiScanning: 'no', uiLoading: 'no',
  filterMinCF: 0.0001, filterBeta: 0.01, missTolerance: 10, // mas suave: menos temblor a cambio de algo de retraso
})
const {renderer, scene, camera} = mindar
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5))
// luces directas (x pi respecto a fritada-ar.html, three r155+ usa luces fisicas); RoomEnvironment hacia ver el plato metalico
scene.add(new THREE.HemisphereLight(0xffffff, 0x999999, 4.4))
const sun = new THREE.DirectionalLight(0xffffff, 5); sun.position.set(1, 3, 1); scene.add(sun)

const anchor = mindar.addAnchor(0) // unidades del ancla: 1 = ancho de la tarjeta, Z sale de la tarjeta
const root = new THREE.Group(); root.matrixAutoUpdate = false; root.visible = false; scene.add(root)
const dish = new THREE.Group(); dish.rotation.x = Math.PI / 2; dish.scale.setScalar(1 / CARD_W); root.add(dish)

// sombra de contacto: mancha radial suave bajo el plato (sin sombras en tiempo real)
const sc = document.createElement('canvas'); sc.width = sc.height = 128
const g2 = sc.getContext('2d'), gr = g2.createRadialGradient(64, 64, 8, 64, 64, 64)
gr.addColorStop(0, 'rgba(0,0,0,.6)'); gr.addColorStop(1, 'rgba(0,0,0,0)')
g2.fillStyle = gr; g2.fillRect(0, 0, 128, 128)
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.4), new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false}))
shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.001; dish.add(shadow)

const draco = new DRACOLoader(); draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/gltf/')
const loader = new GLTFLoader(); loader.setDRACOLoader(draco)
loader.load(q.get('m') || 'fritada-lite.glb', (g) => dish.add(g.scene), undefined, (e) => { msg.textContent = 'No cargó el plato: ' + e.message })

let seen = false
const dbg = q.has('debug'); let frames = 0, tracks = 0, prevM = null, t0 = performance.now()

let camError = ''
try {
  await mindar.start() // pide la camara y carga tarjeta.mind
} catch (e) {
  camError = 'No se pudo abrir la cámara: ' + (e.message || e)
  msg.textContent = camError
}
renderer.setAnimationLoop(() => {
  const tracking = anchor.group.visible
  // sin ARCore solo la tarjeta dice donde esta la mesa: sin tarjeta el plato se oculta (el giroscopio lo dejaba pegado a la pantalla)
  root.visible = tracking
  if (tracking) {
    root.matrix.copy(anchor.group.matrix)
    if (!seen) { seen = true; msg.textContent = 'Listo: acércate o rodea la tarjeta.'; setTimeout(() => (msg.style.opacity = 0), 4000) }
  }
  root.matrixWorldNeedsUpdate = true
  renderer.render(scene, camera)

  if (dbg) {
    frames++
    if (anchor.group.matrix !== prevM) { tracks++; prevM = anchor.group.matrix }
    if (performance.now() - t0 > 1000) {
      msg.style.opacity = 1
      const v = mindar.video
      msg.textContent = `FPS ${frames} | seguimiento ${tracks}/s | ${tracking ? 'TARJETA' : seen ? 'PERDIDA' : 'BUSCANDO'} | cam ${v ? v.videoWidth + 'x' + v.videoHeight : '-'} ${camError}`
      frames = tracks = 0; t0 = performance.now()
    }
  }
})
</script>
</body>
</html>
