<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Fritada AR</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
  #cam,#gl{position:fixed;inset:0;width:100%;height:100%}
  #cam{object-fit:cover}
  .ui{position:fixed;display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;font-size:14px;text-decoration:none}
  .btn{width:52px;height:52px;border-radius:50%;background:rgba(30,30,30,.82);display:grid;place-items:center;border:0;padding:0}
  .btn svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  #close{top:16px;right:16px} #three{top:84px;right:16px}
  #rot{right:16px;bottom:18px}
  #msg{position:fixed;left:12px;right:12px;top:16px;padding:10px 14px;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;font-size:15px;text-align:center;pointer-events:none;transition:opacity .6s}
  #dbg{position:fixed;left:8px;bottom:8px;right:84px;padding:4px 8px;border-radius:8px;background:rgba(0,0,0,.55);color:#fff;font:11px/1.35 monospace;pointer-events:none}
  /* aro donde se toca, como el de Snapchat */
  .ring{position:fixed;width:64px;height:64px;margin:-32px 0 0 -32px;border:3px solid #fff;border-radius:50%;background:rgba(255,255,255,.3);pointer-events:none;animation:ring .5s ease-out forwards}
  @keyframes ring{from{transform:scale(.5);opacity:1}to{transform:scale(1.3);opacity:0}}
</style>
<script type="importmap">
{"imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
</head>
<body>
<!-- el video solo entrega los cuadros; lo que se ve es el lienzo, que dibuja cada cuadro junto con el plato -->
<video id="cam" autoplay playsinline muted></video>
<canvas id="gl"></canvas>
<a id="close" class="ui btn" href="fritada.html" aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></a>
<a id="three" class="ui btn" href="fritada.html" aria-label="Ver en 3D"><svg viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></a>
<button id="rot" class="ui" style="background:none;border:0"><span class="btn"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg></span>Rotar</button>
<div id="msg">Apunta a la mesa y acércate o rodea el plato. Toca la mesa para moverlo; con dos dedos cambias su tamaño y lo giras.</div>
<div id="dbg" hidden></div>
<script type="module">
// AR como el de Snapchat en celulares sin ARCore: camara + plato 3D. El sensor de orientacion dice hacia donde mira el celular
// y los puntos de la mesa seguidos en la imagen dicen cuanto se movio, asi el plato queda quieto en la mesa al acercarse o rodearlo.
// Como en Snapchat, cada cuadro de la camara se dibuja junto con la pose calculada para ESE cuadro (LOGICA_FLUIDEZ, seccion 5):
// el plato no puede deslizarse respecto a la mesa aunque el calculo tarde, solo la imagen entera llega unos ms despues.
// shortcut: la altura del celular sobre la mesa es supuesta (?h=), asi que la escala del mundo es aproximada; exacta solo con ARCore/ARKit
import * as THREE from 'three'
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js'
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js'
const q = new URLSearchParams(location.search)
const CAM_H = +q.get('h') || 0.45 // m: altura asumida del celular sobre la mesa (sentado, brazo normal); menor = plato mas grande
// grados que abarca la camara a lo largo de su lado largo (camara principal ~26 mm equivalentes); si el plato "nada" al girar, ajustar
const LONG_FOV = +q.get('fov') || 67
const SPIN = +q.get('rot') || 0 // rad/s: giro automatico del plato (apagado: un plato real no gira; se rodea caminando)
const RES = +q.get('res') || 1920 // px del lado largo pedidos a la camara
const msg = document.getElementById('msg')
const $ = (id) => document.getElementById(id)
const DEBUG = q.has('debug')

const renderer = new THREE.WebGLRenderer({canvas: $('gl'), antialias: true}) // opaco: dibuja tambien la imagen de la camara
renderer.setPixelRatio(Math.min(devicePixelRatio, 2))
renderer.toneMapping = THREE.NeutralToneMapping
renderer.toneMappingExposure = +q.get('exp') || 0.85 // mas alto se ve mas blanco que un plato real bajo la luz de la sala
renderer.shadowMap.enabled = true
renderer.shadowMap.autoUpdate = false // la sombra solo cambia si el plato se mueve (ver shadowDirty), no cuando se mueve la camara
const scene = new THREE.Scene()
// luz ambiente pareja; la comida es Lambert (sin reflejos), asi que no hace falta un entorno que refleje
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a7f74, +q.get('amb') || 3))
const camera = new THREE.PerspectiveCamera(65, 1, 0.01, 50)
camera.position.set(0, CAM_H, 0)
// la mesa: invisible, solo recibe la sombra del plato
const ground = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.ShadowMaterial({opacity: 0.55}))
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true
scene.add(ground)
// luz del techo, arriba y detras del plato: la sombra cae hacia quien mira, como la de un plato real en la mesa
const sun = new THREE.DirectionalLight(0xffe8d0, 1.5); sun.castShadow = true // calida, como los focos de una sala
Object.assign(sun.shadow.camera, {left: -0.4, right: 0.4, top: 0.4, bottom: -0.4, near: 0.1, far: 3})
sun.shadow.mapSize.set(1024, 1024); sun.shadow.radius = 4; sun.shadow.bias = -0.0005
scene.add(sun, sun.target)

// sombra de contacto: oscurece justo donde el plato toca la mesa
const sc = document.createElement('canvas'); sc.width = sc.height = 128
const g2 = sc.getContext('2d'), gr = g2.createRadialGradient(64, 64, 8, 64, 64, 64)
gr.addColorStop(0, 'rgba(0,0,0,.5)'); gr.addColorStop(0.55, 'rgba(0,0,0,.35)'); gr.addColorStop(1, 'rgba(0,0,0,0)')
g2.fillStyle = gr; g2.fillRect(0, 0, 128, 128)
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.32), new THREE.MeshBasicMaterial({map: new THREE.CanvasTexture(sc), transparent: true, depthWrite: false}))
shadow.rotation.x = -Math.PI / 2; shadow.visible = false
scene.add(shadow)

// --- la imagen de la camara, dibujada en el mismo lienzo y en el mismo instante que el plato ---
// un rectangulo que cubre la pantalla, primero y sin profundidad; muestra la parte del cuadro que entra (como object-fit:cover)
let bgTex = null
const bgMat = new THREE.ShaderMaterial({
  uniforms: {map: {value: null}, crop: {value: new THREE.Vector4(0, 0, 1, 1)}}, // crop: desde (x, y) arriba-izq, ancho, alto (0..1)
  vertexShader: 'uniform vec4 crop; varying vec2 vUv; void main() { vUv = crop.xy + vec2(uv.x, 1.0 - uv.y) * crop.zw; gl_Position = vec4(position.xy, 1.0, 1.0); }',
  fragmentShader: 'uniform sampler2D map; varying vec2 vUv; void main() { gl_FragColor = texture2D(map, vUv); }', // colores tal cual llegan
  depthTest: false, depthWrite: false,
})
const bg = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMat)
bg.frustumCulled = false; bg.renderOrder = -1; bg.visible = false
scene.add(bg)
let fw = 0, fh = 0 // tamano del cuadro de la camara
// el angulo de vision de la camara 3D debe ser el mismo que el de la parte del cuadro que se ve, o el plato se desliza al girar
const fit = () => {
  renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight
  if (fw) {
    const s = Math.max(innerWidth / fw, innerHeight / fh), vw = innerWidth / s, vh = innerHeight / s // px del cuadro que se ven
    bgMat.uniforms.crop.value.set((1 - vw / fw) / 2, (1 - vh / fh) / 2, vw / fw, vh / fh)
    const perPx = Math.tan(THREE.MathUtils.degToRad(LONG_FOV) / 2) / (Math.max(fw, fh) / 2)
    camera.fov = THREE.MathUtils.radToDeg(2 * Math.atan(perPx * vh / 2))
  }
  camera.updateProjectionMatrix(); dirty = true
}
const showFrame = (bmp) => { // nuevo cuadro de fondo (se sube a la GPU en el proximo dibujo)
  if (!bgTex || bmp.width !== fw || bmp.height !== fh) { // primer cuadro o el celular giro: textura y recorte nuevos
    bgTex?.dispose(); bgTex = new THREE.Texture(); bgTex.flipY = false; bgTex.generateMipmaps = false; bgTex.minFilter = THREE.LinearFilter
    bgMat.uniforms.map.value = bgTex; fw = bmp.width; fh = bmp.height; fit()
  }
  bgTex.image = bmp; bgTex.needsUpdate = true; bg.visible = true; dirty = true
}
let dirty = true
fit(); addEventListener('resize', fit)

const cam = $('cam')
navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment', width: {ideal: RES}, height: {ideal: Math.round(RES * 9 / 16)}}})
  .then((s) => { cam.srcObject = s })
  .catch((e) => { msg.textContent = 'No se pudo abrir la camara: ' + e.message })

// --- sensores ---
// orientacion (misma formula que three DeviceOrientationControls). En celulares sin giroscopio (p. ej. Honor LLY-LX3: solo
// acelerometro + brujula) llega temblando ~0.2 grados y atrasada; por eso el plato nunca se orienta directo con ella mientras
// se ve la mesa: el seguidor la usa como punto de partida y la corrige con la imagen
const zee = new THREE.Vector3(0, 0, 1), q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)), tmp = new THREE.Quaternion(), eul = new THREE.Euler()
let gotSensor = false, yaw0 = null, hasGyro = false
const hist = [] // [hora, orientacion] de las ultimas lecturas: hacia donde miraba el celular cuando se tomo cada cuadro
addEventListener('deviceorientation', (e) => {
  if (e.alpha == null) return
  gotSensor = true
  const d = THREE.MathUtils.degToRad
  if (yaw0 === null) yaw0 = d(e.alpha) // el norte no importa: el plato se coloca en relacion a donde miras
  const orient = d(screen.orientation ? screen.orientation.angle : 0)
  eul.set(d(e.beta), d(e.alpha) - yaw0, -d(e.gamma), 'YXZ')
  const qo = new THREE.Quaternion().setFromEuler(eul).multiply(q1).multiply(tmp.setFromAxisAngle(zee, -orient))
  hist.push([e.timeStamp || performance.now(), qo]); if (hist.length > 30) hist.shift()
})
const sensorAt = (t, out) => { // orientacion a la hora t, interpolada entre las dos lecturas que la rodean
  let i = hist.length - 1
  while (i > 0 && hist[i][0] > t) i--
  const a = hist[i], b = hist[i + 1]
  return b ? out.copy(a[1]).slerp(b[1], Math.max(0, (t - a[0]) / (b[0] - a[0]))) : out.copy(a[1])
}
// giroscopio de verdad: solo lo tienen los celulares que entregan velocidad de giro. Se usa para notar un giro (quietud)
const rates = [] // [hora, rad/s]
addEventListener('devicemotion', (e) => {
  const r = e.rotationRate
  if (!r || r.alpha == null) return
  hasGyro = true
  rates.push([e.timeStamp || performance.now(), Math.hypot(r.alpha, r.beta, r.gamma) * Math.PI / 180]); if (rates.length > 60) rates.shift()
})
// movimientos MUY bruscos (prueba 01-11): sin giroscopio la inclinacion sale del acelerometro, que no distingue la gravedad del
// empujon de la mano; el plato se despegaba de la mesa, se ladeaba y quedaba asi. Mientras dure (y 0.6 s despues, lo que tarda
// el sensor en asentarse) no se sigue: el plato queda en su ultima pose buena y el seguidor no aprende nada de esos cuadros
let bruscoHasta = 0
addEventListener('devicemotion', (e) => {
  const a = e.accelerationIncludingGravity
  if (!hasGyro && a && a.x != null && Math.abs(Math.hypot(a.x, a.y, a.z) - 9.81) > 4) bruscoHasta = performance.now() + 600
})
const rateBetween = (t0, t1) => { let s = 0, n = 0; for (const [t, v] of rates) if (t > t0 && t <= t1) { s += v; n++ } return n ? s / n : 0 }
// iOS exige un permiso tras un toque; Chrome Android tambien expone requestPermission, por eso se escucha siempre
addEventListener('touchend', () => {
  if (typeof DeviceOrientationEvent !== 'undefined' && DeviceOrientationEvent.requestPermission) DeviceOrientationEvent.requestPermission().catch(() => {})
  if (typeof DeviceMotionEvent !== 'undefined' && DeviceMotionEvent.requestPermission) DeviceMotionEvent.requestPermission().catch(() => {})
}, {once: true})
setTimeout(() => { if (!gotSensor) msg.textContent = 'Este celular no entrega datos del sensor de movimiento.' }, 2500)

// --- cuadros: captura -> seguidor (fritada-track.js, en otro hilo) -> dibujo con su pose ---
// Un cuadro en calculo y como mucho uno esperando (el mas nuevo reemplaza al que esperaba): nunca se forma una cola de cuadros
// viejos (LOGICA_FLUIDEZ, seccion 4). Cada cuadro se toma en dos tamanos a la vez: completo para mostrarlo, chico para seguir puntos
const TW = 320 // px del lado largo del cuadro chico: alcanza para la veta de la mesa y es rapido en celulares modestos
const tracker = new Worker('fritada-track.js')
tracker.postMessage({h: CAM_H, fov: LONG_FOV})
let capturing = false, active = null, pending = null, nextId = 0, shown = null, capMs = 0
const retire = [] // cuadros ya reemplazados en pantalla: se liberan despues del dibujo que sube el nuevo
const drop = (f) => { f.full.close(); f.small?.close() }
const send = (f) => {
  if (!gotSensor) { f.small.close(); f.small = null; return present(f, null) } // sin sensor no hay seguimiento: se muestra la camara igual
  if (performance.now() < bruscoHasta) { f.small.close(); f.small = null; return present(f, null) } // bloqueado: ver bruscoHasta
  active = f; f.sent = performance.now()
  tracker.postMessage({id: f.id, bmp: f.small, t: f.t, q: sensorAt(f.t, tmp).toArray(), gyro: hasGyro, debug: DEBUG}, [f.small]); f.small = null
}
const onFrame = (now, meta) => {
  if (cam.requestVideoFrameCallback) cam.requestVideoFrameCallback(onFrame); else requestAnimationFrame(pollFrame)
  if (capturing || !cam.videoWidth) return
  if (active && performance.now() - active.sent > 2000) { drop(active); active = null } // el seguidor no respondio: no trabar todo
  const t = meta?.captureTime || now, k = TW / Math.max(cam.videoWidth, cam.videoHeight), c0 = performance.now()
  capturing = true
  Promise.all([createImageBitmap(cam), createImageBitmap(cam, {resizeWidth: Math.round(cam.videoWidth * k), resizeHeight: Math.round(cam.videoHeight * k), resizeQuality: 'medium'})])
    .then(([full, small]) => {
      capturing = false; capMs = capMs * 0.9 + (performance.now() - c0) * 0.1
      const f = {id: ++nextId, t, full, small}
      if (!active) send(f)
      else { if (pending) drop(pending); pending = f }
    })
    .catch(() => (capturing = false))
}
let lastVT = -1 // navegadores sin requestVideoFrameCallback: se mira si cambio el cuadro en cada repintado
const pollFrame = (now) => { if (cam.currentTime !== lastVT) { lastVT = cam.currentTime; onFrame(now) } else requestAnimationFrame(pollFrame) }
if (cam.requestVideoFrameCallback) cam.requestVideoFrameCallback(onFrame); else requestAnimationFrame(pollFrame)
tracker.onmessage = ({data: m}) => {
  const f = active
  if (!f || f.id !== m.id) return // respuesta de un cuadro ya descartado
  active = null
  if (pending) { const p = pending; pending = null; send(p) } // el siguiente empieza ya, mientras este se dibuja
  present(f, m)
}

// --- pose dibujada (LOGICA_ESTABILIDAD_3D_SIN_TEMBLORES.md) ---
// Una vez por cuadro: la pose medida por el seguidor -> la pose con la que se dibuja ESE cuadro. Con el celular quieto (la mesa
// no se mueve en la imagen y, si hay giroscopio, no gira) la pose se retiene: el ruido de cada medida ya no mueve el plato. Al
// primer movimiento claro se suelta y se sigue al instante. La quietud se mide por segundo, no por cuadro, para que valga igual
// en un celular que sigue 30 cuadros/s que en uno que sigue 10.
let motion = 1, still = false, stillSince = 0, moveHits = 0, hasPose = false, prevT = 0, lastM = null, sensorSince = 0
const cHold = new THREE.Vector3(), qHold = new THREE.Quaternion(), cVis = new THREE.Vector3(), qVis = new THREE.Quaternion()
const probe = new THREE.PerspectiveCamera(), box = new THREE.Box3(), va = new THREE.Vector3(), vb = new THREE.Vector3()
const corners = Array.from({length: 8}, () => new THREE.Vector3())
// cuanto cambia el plato en pantalla (px CSS) entre verlo desde la pose a y desde la b, medido en las esquinas de su caja real
const screenDiff = (ca, qa, cb, qb) => {
  box.setFromObject(plate); let i = 0, d = 0, n = 0
  for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) corners[i++].set(x, y, z)
  probe.copy(camera)
  for (const p of corners) {
    probe.position.copy(ca); probe.quaternion.copy(qa); probe.updateMatrixWorld(); va.copy(p).project(probe)
    probe.position.copy(cb); probe.quaternion.copy(qb); probe.updateMatrixWorld(); vb.copy(p).project(probe)
    if (Math.abs(va.z) > 1 || Math.abs(vb.z) > 1) continue // detras de la camara o fuera del recorte: no sirve para medir
    d = Math.max(d, Math.hypot((va.x - vb.x) * innerWidth, (va.y - vb.y) * innerHeight) / 2); n++
  }
  return n ? d : null
}
const present = (f, m) => {
  if (shown) retire.push(shown.full)
  shown = f; showFrame(f.full)
  if (!m) return
  lastM = m; sensorSince ||= performance.now()
  const dt = prevT ? Math.min(0.5, Math.max(0.001, (f.t - prevT) / 1000)) : 0.033; prevT = f.t
  if (m.tracking) {
    cVis.fromArray(m.c); qVis.fromArray(m.qv)
    // >= 1: movimiento. 8 px/s de la mesa en la imagen de 320 px (la mano "quieta" mueve 1-3) o 0.1 rad/s de giro. Una
    // evidencia debil (< 2) tiene que repetirse en el cuadro siguiente: el ruido de la camara a veces la cruza una vez. Al soltar
    // por evidencia debil el plato se acomoda suave; un movimiento claro se sigue al instante
    const ev = Math.max(m.flow / dt / 8, hasGyro ? rateBetween(f.t - dt * 1000, f.t) / 0.1 : 0)
    moveHits = ev >= 1 ? moveHits + 1 : 0
    if (!hasPose || m.reloc || ev >= 2 || moveHits >= 2) { motion = Math.max(motion, !hasPose || m.reloc ? 1 : Math.min(1, ev / 3)); still = false; stillSince = 0 }
    else if (ev < 1) {
      // desplazamiento lento acumulado respecto a lo retenido: se suelta, pero corrigiendo suave (no es prueba de movimiento)
      if (still && placed && screenDiff(cHold, qHold, cVis, qVis) > 3) { still = false; stillSince = 0; motion = Math.max(motion, 0.5) }
      else {
        motion *= Math.exp(-dt / 0.15) // entrar en quietud es gradual; salir, inmediato (arriba)
        if (!stillSince) stillSince = f.t
        if (!still && f.t - stillSince > 300) { still = true; cHold.copy(camera.position); qHold.copy(camera.quaternion) }
      }
    }
    const a = motion > 0.99 ? 1 : 1 - Math.exp(-dt / ((1 - motion) * 0.25))
    if (still) { camera.position.copy(cHold); camera.quaternion.copy(qHold) }
    else { camera.position.lerp(cVis, a); camera.quaternion.slerp(qVis, a) }
    hasPose = true
  } else if (m.state !== 'degradado') {
    // sin la mesa a la vista: la posicion queda, la orientacion sigue al sensor (suavizada si no hay giroscopio: tiembla)
    still = false; stillSince = 0; motion = 1
    camera.quaternion.slerp(qVis.fromArray(m.qv), hasGyro ? 1 : 1 - Math.exp(-dt / 0.15))
  } // degradado (un cuadro dudoso): no cuenta como quietud ni cambia de fuente; se dibuja con la ultima pose buena
  if (DEBUG) debugInfo(m)
}
let nFrames = 0, fpsT = performance.now(), fps = 0
const debugInfo = (m) => { // ?debug: una linea abajo, sin tapar el plato
  nFrames++; const now = performance.now(); if (now - fpsT > 1000) { fps = nFrames * 1000 / (now - fpsT); nFrames = 0; fpsT = now }
  const s = m.st || {}
  $('dbg').hidden = false
  $('dbg').textContent = `${fps.toFixed(0)} cuadros/s | seguidor ${m.ms.toFixed(0)} ms (lk ${(s.lk || 0).toFixed(0)} img ${(s.img || 0).toFixed(0)}) captura ${capMs.toFixed(0)} ms | ` +
    `${m.state} ${still ? 'QUIETO' : 'mov ' + motion.toFixed(2)} | ${m.n}/${m.maxp} puntos ${m.kf} vistas | giroscopio ${hasGyro ? 'si' : 'no'} | ${fw}x${fh}`
  // para pruebas automaticas: cuadro recien procesado (su numero va en m.strip) y la pose con la que se dibuja
  window.dbg = {strip: m.strip, camera, plate, still, motion, ms: m.ms, n: m.n, state: m.state, flow: m.flow, c: m.c, dt: m.dt}; window.dbgHook?.()
}

let plate, placed = false, baseY = 0, dropT = 0
const shadowDirty = () => { renderer.shadowMap.needsUpdate = true; dirty = true }
const setScale = (s) => {
  plate.scale.setScalar(Math.min(4, Math.max(0.4, s)))
  shadow.scale.setScalar(plate.scale.x); shadowDirty()
}
const setPos = (p) => {
  plate.position.copy(p); shadow.position.set(p.x, 0.001, p.z)
  sun.target.position.copy(p); sun.position.set(p.x, 0.7, p.z - 0.6) // mas alto = sombra mas corta bajo el plato; -z = mas lejos de quien mira
  shadowDirty()
}
const dropAt = (p) => { setPos(p); baseY = p.y; dropT = performance.now() } // aparece cayendo un poco en p

const draco = new DRACOLoader()
draco.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/libs/draco/gltf/')
const loader = new GLTFLoader(); loader.setDRACOLoader(draco)
let plateReady = false
loader.load(q.get('glb') || 'fritada.glb', (g) => { // ?glb=: un plato escaneado (escanear.html)
  plate = g.scene; scene.add(plate)
  // la sombra mide como el plato que se cargo (0.32 m era para la fritada de 27 cm), sirve para cualquier plato
  const sz = new THREE.Box3().setFromObject(plate).getSize(new THREE.Vector3()), w = Math.max(sz.x, sz.z) * 1.19
  shadow.geometry.dispose(); shadow.geometry = new THREE.PlaneGeometry(w, w)
  // nitidez de las texturas al mirar el plato en angulo
  plate.traverse((o) => { const m = o.material; if (m) for (const k of ['map', 'normalMap']) if (m[k]) m[k].anisotropy = renderer.capabilities.getMaxAnisotropy() })
  plate.traverse((o) => {
    if (!o.isMesh) return
    o.castShadow = true
    // Lambert = sin ningun reflejo, como el hot dog de Snapchat; el material PBR brillaba (comida "mojada") aunque fuera rugoso.
    // Color: tono calido de la luz de una sala (medido en la foto de un plato real: blanco crema, no blanco azulado)
    // Un plato escaneado (?glb=) ya trae la luz real en sus fotos: sin luces ni tinte, igual que en la camara (con el tinte crema y
    // las luces salia verde y oscuro, 31-10)
    const m = o.material
    o.material = q.get('glb') && !q.get('tint') ? new THREE.MeshBasicMaterial({map: m.map, toneMapped: false})
      : new THREE.MeshLambertMaterial({map: m.map, normalMap: m.normalMap, color: q.get('tint') ? '#' + q.get('tint') : 0xffecd8})
    m.dispose()
  })
  // los programas de la GPU se preparan antes de mostrar el plato: compilarlos al aparecer trababa ese primer cuadro
  shadow.visible = true
  renderer.compileAsync(scene, camera).catch(() => {}).finally(() => { plateReady = true })
  plate.visible = shadow.visible = false
}, undefined, (e) => { msg.textContent = 'No cargo el plato: ' + e.message })

const ray = new THREE.Raycaster(); ray.far = 3 // m: mas lejos el plano supuesto ya no es la mesa
const hitGround = (cx, cy) => {
  ray.setFromCamera(new THREE.Vector2((cx / innerWidth) * 2 - 1, -(cy / innerHeight) * 2 + 1), camera)
  return ray.intersectObject(ground)[0]
}
const ripple = (x, y) => { const r = document.body.appendChild(document.createElement('div')); r.className = 'ring'; r.style.left = x + 'px'; r.style.top = y + 'px'; setTimeout(() => r.remove(), 600) }
const dist = (e) => Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY)
const angle = (e) => Math.atan2(e.touches[1].clientY - e.touches[0].clientY, e.touches[1].clientX - e.touches[0].clientX)
let d0, s0, a0, r0, tap = null, grab = null
addEventListener('touchstart', (e) => {
  if (!placed || e.target.closest('.ui')) return
  if (e.touches.length === 2) { tap = grab = null; d0 = dist(e); s0 = plate.scale.x; a0 = angle(e); r0 = plate.rotation.y; return }
  const t = e.touches[0], h = hitGround(t.clientX, t.clientY)
  tap = {x: t.clientX, y: t.clientY, t: performance.now()}
  // tocando el plato se lo arrastra con el dedo (se guarda la distancia del dedo a su centro para que no salte)
  grab = h && h.point.distanceTo(plate.position) < 0.16 * plate.scale.x ? plate.position.clone().sub(h.point) : null
})
addEventListener('touchmove', (e) => {
  if (!placed) return
  if (e.touches.length === 2) { setScale(s0 * dist(e) / d0); plate.rotation.y = r0 - (angle(e) - a0); return } // pellizco: tamano; giro de dedos: rota
  const t = e.touches[0], h = grab && hitGround(t.clientX, t.clientY)
  if (tap && Math.hypot(t.clientX - tap.x, t.clientY - tap.y) > 12) tap = null
  if (h) setPos(h.point.add(grab))
})
addEventListener('touchend', (e) => {
  // toque corto en la mesa: el plato salta ahi. Al soltar y no al apoyar, para que el primer dedo de un pellizco no lo mueva
  if (tap && !grab && !e.touches.length && performance.now() - tap.t < 400) { const h = hitGround(tap.x, tap.y); if (h) { dropAt(h.point); ripple(tap.x, tap.y) } }
  tap = null
})
// pantalla completa al primer toque: sin la barra de Chrome, como la camara de Snapchat
addEventListener('touchend', () => document.documentElement.requestFullscreen?.().catch(() => {}), {once: true})
$('rot').onclick = () => { if (placed) { plate.rotation.y += Math.PI / 4; shadowDirty() } }

// dibujo: solo cuando hay algo nuevo (un cuadro de la camara con su pose, un gesto o la caida del plato); repintar lo mismo
// 60 veces por segundo le quitaba tiempo al seguidor
const clock = new THREE.Clock()
renderer.setAnimationLoop(() => {
  const dt = Math.min(0.1, clock.getDelta())
  if (placed) {
    if (SPIN) { plate.rotation.y += SPIN * dt; shadowDirty() }
    // caida suave al aparecer (~400 ms): baja desde 12 cm con un rebote leve, para que se sienta vivo
    const e = (performance.now() - dropT) / 400
    if (e < 1) { const k = 1 - Math.pow(1 - e, 3); plate.position.y = baseY + 0.12 * (1 - k); shadow.material.opacity = k; shadowDirty() }
    else if (shadow.material.opacity < 1) { plate.position.y = baseY; shadow.material.opacity = 1; shadowDirty() }
  }
  // primera vez: el plato aparece donde apunta el centro de la pantalla en cuanto hay una pose medida; en una mesa sin textura
  // que seguir, al segundo y medio con la orientacion del sensor (como antes de seguir puntos)
  if (!placed && plateReady && (hasPose || (sensorSince && performance.now() - sensorSince > 1500))) {
    const h = hitGround(innerWidth / 2, innerHeight / 2)
    if (h) { dropAt(h.point); setScale(1); plate.visible = shadow.visible = placed = true; setTimeout(() => (msg.style.opacity = 0), 6000) }
  }
  if (!dirty) return
  dirty = false
  renderer.render(scene, camera)
  for (const b of retire) b.close()
  retire.length = 0
})
</script>
</body>
</html>
